<script type="text/x-dc" data-dc-script data-props="{&quot;introAnimation&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;trailMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Stays lit&quot;,&quot;Passes by&quot;],&quot;default&quot;:&quot;Stays lit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;countUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  state = { hover: -1, navHover: -1, w: null, menu: false, countT: null };
  refs = { bg: React.createRef(), glow: React.createRef(), line: React.createRef(), headGlow: React.createRef(), headCore: React.createRef(), l1: React.createRef(), l2: React.createRef(), l3: React.createRef(), band: React.createRef(), stats: React.createRef() };
  anims = []; timers = [];

  NAV = [
    { label: 'About', href: '/#about' },
    { label: 'Cases', href: '/cases' },
    { label: 'Publications', href: '/publications' },
    { label: 'Services', href: '/#services' },
    { label: 'Practices', href: '/practice-areas' },
    { label: 'Contact', href: '/contact' }
  ];
  STATS = [
    { label: 'Year Forensic Accounting Practice', lines: 'Year Forensic\nAccounting\nPractice', href: '/#about', to: 30, suffix: '+', final: '30+' },
    { label: 'Forensic Accounting Cases', lines: 'Forensic Accounting\nCases', href: '/cases', to: 1000, suffix: '+', comma: true, final: '1,000+' },
    { label: 'Authored Research Publications', lines: 'Authored\nResearch\nPublications', href: '/publications', to: 20, final: '20' },
    { label: 'Professional Certifications', lines: 'Professional\nCertifications', href: '/#certifications', to: 6, final: '6' },
    { label: 'Forensic Experience', href: '/team', final: 'BIG 4', text: true },
    { label: 'Jury Award', href: '/cases', to: 2.3, dec: 1, prefix: '$', suffix: 'B', final: '$2.3B' }
  ];
  COUNT_START = 3500; COUNT_STAGGER = 110; COUNT_DUR = 1400;

  // Measure the hero so the photo and the gold-line SVG can be placed together (see artBox).
  onResize = () => {
    const b = this.refs.bg && this.refs.bg.current;
    this.setState({ w: window.innerWidth, bw: b ? b.clientWidth : null, bh: b ? b.clientHeight : null });
  };

  // Cover-fit the 2400x1602 photo. On desktop, pin it left and show it from 22.4% down
  // its height at the top of the hero, matching the approved design (E&E_Website_Home_FA.pdf).
  artBox(width) {
    const { bw, bh } = this.state;
    if (!bw || !bh) return null;
    const s = Math.max(bw / 2400, bh / 1602), dw = 2400 * s, dh = 1602 * s;
    const desktop = width >= 700;
    const x = desktop ? 0 : (bw - dw) / 2;
    const y = desktop ? Math.min(0, Math.max(bh - dh, -0.224 * dh)) : (bh - dh) / 2;
    return { x, y, w: dw, h: dh };
  }

  componentDidMount() {
    this.onResize();
    window.addEventListener('resize', this.onResize);
    if (window.ResizeObserver && this.refs.bg.current) { this.ro = new ResizeObserver(this.onResize); this.ro.observe(this.refs.bg.current); }
    this.play();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); if (this.ro) this.ro.disconnect(); this.stop(); }
  componentDidUpdate(p) {
    if (p.introAnimation !== this.props.introAnimation || p.trailMode !== this.props.trailMode || p.countUp !== this.props.countUp) this.play();
  }

  stop() {
    this.anims.forEach(a => a.cancel()); this.anims = [];
    this.timers.forEach(t => clearTimeout(t)); this.timers = [];
    if (this.raf) cancelAnimationFrame(this.raf);
  }

  play() {
    this.stop();
    const R = this.refs, el = k => R[k].current;
    const on = this.props.introAnimation ?? true;
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    ['line', 'glow'].forEach(k => { const e = el(k); if (e) { e.removeAttribute('stroke-dasharray'); e.style.strokeDashoffset = ''; } });
    if (!on || reduced) { this.setState({ countT: null }); return; }

    const A = (e, kf, o) => { if (!e || !e.animate) return; const a = e.animate(kf, Object.assign({ fill: 'both' }, o)); this.anims.push(a); return a; };
    const ease = 'cubic-bezier(.16,1,.3,1)';
    const drive = 'cubic-bezier(.5,0,.3,1)';

    A(el('bg'), [{ opacity: 0.35, transform: 'scale(1.07)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 3200, easing: 'cubic-bezier(.2,.6,.2,1)' });

    // One, two, three — the headline arrives from the right
    [['l1', 300], ['l2', 750], ['l3', 1200]].forEach(([k, d]) =>
      A(el(k), [{ opacity: 0, transform: 'translateX(140px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: d, easing: ease }));

    // The light trail
    const T0 = 1750, TD = 1700;
    const passes = (this.props.trailMode ?? 'Stays lit') === 'Passes by';
    const L = el('line') && el('line').getTotalLength ? el('line').getTotalLength() : 1500;
    ['line', 'glow'].forEach(k => {
      const e = el(k); if (!e) return;
      e.setAttribute('stroke-dasharray', `${L} ${L}`);
      if (passes) A(e, [{ strokeDashoffset: L, offset: 0 }, { strokeDashoffset: 0, offset: 0.62 }, { strokeDashoffset: -L, offset: 1 }], { duration: TD * 1.6, delay: T0, easing: drive });
      else A(e, [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: TD, delay: T0, easing: drive });
    });
    const H = L * 0.06;
    ['headGlow', 'headCore'].forEach(k => {
      const e = el(k); if (!e) return;
      e.setAttribute('stroke-dasharray', `${H} ${L * 3}`);
      A(e, [{ strokeDashoffset: H, opacity: 0 }, { opacity: 1, offset: 0.06 }, { opacity: 1, offset: 0.9 }, { strokeDashoffset: -L, opacity: 0 }], { duration: TD, delay: T0, easing: drive });
    });
    if (!passes) A(el('glow'), [{ opacity: 0.35 }, { opacity: 0.7, offset: 0.4 }, { opacity: 0.35 }], { duration: 1400, delay: T0 + TD - 200, easing: 'ease-in-out', composite: 'replace' });

    // Boom — the numbers band rises
    const B0 = 3150;
    A(el('band'), [{ transform: 'translateY(105%)' }, { transform: 'none' }], { duration: 950, delay: B0, easing: ease });
    const lis = el('stats') ? el('stats').querySelectorAll('[data-stat]') : [];
    lis.forEach((li, i) => A(li, [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: B0 + 300 + i * this.COUNT_STAGGER, easing: ease }));

    if (this.props.countUp ?? true) {
      this.setState({ countT: 0 });
      const t0 = performance.now();
      const tick = now => {
        const t = now - t0;
        this.setState({ countT: t });
        if (t < this.COUNT_START + this.COUNT_STAGGER * 6 + this.COUNT_DUR) this.raf = requestAnimationFrame(tick);
        else this.setState({ countT: null });
      };
      this.raf = requestAnimationFrame(tick);
      this.timers.push(setTimeout(() => { cancelAnimationFrame(this.raf); this.setState({ countT: null }); }, this.COUNT_START + this.COUNT_STAGGER * 6 + this.COUNT_DUR + 400));
    } else this.setState({ countT: null });
  }

  fmt(s, i) {
    const t = this.state.countT;
    if (t === null || s.text) return s.final;
    const p = Math.min(1, Math.max(0, (t - this.COUNT_START - i * this.COUNT_STAGGER) / this.COUNT_DUR));
    const e = 1 - Math.pow(1 - p, 3);
    let v = s.to * e;
    let str = s.dec ? v.toFixed(s.dec) : String(Math.round(v));
    if (s.comma) str = Math.round(v).toLocaleString('en-US');
    return (s.prefix || '') + str + (s.suffix || '');
  }

  renderVals() {
    const { hover, navHover, w, menu } = this.state;
    const width = w ?? 1440;
    const showNav = width >= 1100;
    const setHover = i => () => this.setState({ hover: i });
    return {
      refs: this.refs,
      ...(() => {
        const a = this.artBox(width), px = n => n.toFixed(2) + 'px';
        if (!a) return { bgSize: 'cover', bgPos: width >= 700 ? '0% 50%' : '50% 50%', svgAlign: width >= 700 ? 'xMinYMid slice' : 'xMidYMid slice', art: { x: '0px', y: '0px', w: '100%', h: '100%' } };
        return { bgSize: px(a.w) + ' ' + px(a.h), bgPos: px(a.x) + ' ' + px(a.y), svgAlign: 'xMinYMin meet', art: { x: px(a.x), y: px(a.y), w: px(a.w), h: px(a.h) } };
      })(),
      showNav,
      showBurger: !showNav,
      showPillText: width >= 640,
      pillPadR: width >= 640 ? 'clamp(20px,2.4vw,36px)' : '8px',
      pillTop: width >= 1100 ? '-0.48vw' : '0px',
      pillPadL: width >= 640 ? 'clamp(12px,1.9vw,28px)' : '8px',
      menuOpen: menu ? 'true' : 'false',
      menuVisible: !showNav && menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      navLeave: () => this.setState({ navHover: -1 }),
      nav: this.NAV.map((n, i) => ({ ...n, enter: () => this.setState({ navHover: i }), rule: navHover === i ? '100%' : '0%' })),
      statPad: width >= 1000 ? '0 1.9vw 0 1.46vw' : '0',
      labelWS: width >= 1000 ? 'pre-line' : 'normal',
      labelMax: width >= 1000 ? 'none' : '150px',
      statCols: width >= 1000 ? 'repeat(6,auto)' : width >= 600 ? 'repeat(3,minmax(0,1fr))' : 'repeat(2,minmax(0,1fr))',
      statLeave: () => this.setState({ hover: -1 }),
      stats: this.STATS.map((s, i) => {
        const on = hover === i, dim = hover !== -1 && !on;
        return {
          ...s,
          display: this.fmt(s, i),
          text: width >= 1000 && s.lines ? s.lines : s.label,
          aria: `${s.final} ${s.label} — learn more`,
          enter: setHover(i),
          op: dim ? 0.6 : 1,
          bg: on ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0)',
          numT: on ? 'translateY(-4px) scale(1.07)' : 'none',
          glow: on ? '0 0 26px rgba(212,175,55,0.5)' : '0 0 0 rgba(212,175,55,0)',
          rule: on ? '36px' : '0px',
          moreOp: on ? 1 : 0,
          moreT: on ? 'translateY(0)' : 'translateY(4px)'
        };
      })
    };
  }
}
</script>
